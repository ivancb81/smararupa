<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Responsive Header Bootstrap</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

        <style>
            .logo-spacing {
                letter-spacing: 2px;
            }
            .est-spacing {
                font-size: 10px;
                letter-spacing: 1px;
            }
            .menu-spacing {
                letter-spacing: 1px;
            }
            .custom-badge {
                background-color: #7ab9e0;
                font-size: 0.65rem;
                padding: 0.35em 0.5em;
            }
        </style>
    </head>
    <body>
        <header class="bg-white sticky-top">
            <div class="container-fluid px-3 px-lg-5">
                <div class="row align-items-center py-3">
                    <div class="col-3 col-lg-4">
                        <button class="btn btn-link text-dark p-0 fs-3 d-lg-none text-decoration-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu" aria-controls="mobileMenu">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>

                    <div class="col-6 col-lg-4 text-center d-flex flex-column align-items-center">
                        <a href="#" class="text-decoration-none text-dark">
                            <div class="fs-3 fw-bold logo-spacing">ART&SCIENCE</div>
                            <div class="fw-bold est-spacing">EST.2014</div>
                        </a>
                    </div>

                    <div class="col-3 col-lg-4 d-flex justify-content-end align-items-center gap-3 gap-lg-4">
                        <a href="#" class="text-decoration-none text-dark d-none d-lg-inline fw-medium menu-spacing fs-6">ACCOUNT</a>
                        <a href="#" class="text-dark d-none d-lg-inline fs-5"><i class="fa-solid fa-heart"></i></a>
                        <a href="#" class="text-dark d-lg-none fs-5"><i class="fa-solid fa-magnifying-glass"></i></a>
                        <a href="#" class="text-dark d-lg-none fs-5"><i class="fa-regular fa-user"></i></a>
                        <a href="#" class="text-dark position-relative fs-5">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill custom-badge">1</span>
                        </a>
                        <a href="#" class="text-dark d-none d-lg-inline fs-5"><i class="fa-solid fa-magnifying-glass"></i></a>
                    </div>
                </div>
            </div>

            <nav class="d-none d-lg-block border-top border-bottom border-dark py-3">
                <ul class="nav justify-content-center gap-5">
                    <li class="nav-item"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">NEW ARRIVAL</a></li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">BRANDS <i class="fa-solid fa-chevron-down ms-1" style="font-size: 10px"></i></a>
                    </li>
                    <li class="nav-item"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">BOOKS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">COLLECTIBLE</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">CLOTHING</a></li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">LIFESTYLE <i class="fa-solid fa-chevron-down ms-1" style="font-size: 10px"></i></a>
                    </li>
                </ul>
            </nav>
        </header>

        <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
            <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title fw-bold logo-spacing fs-4" id="mobileMenuLabel">MENU</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="nav flex-column gap-3 mt-2">
                    <li class="nav-item border-bottom pb-2"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">NEW ARRIVAL</a></li>
                    <li class="nav-item border-bottom pb-2 d-flex justify-content-between align-items-center">
                        <a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">BRANDS</a>
                        <i class="fa-solid fa-chevron-down text-muted"></i>
                    </li>
                    <li class="nav-item border-bottom pb-2"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">BOOKS</a></li>
                    <li class="nav-item border-bottom pb-2"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">COLLECTIBLE</a></li>
                    <li class="nav-item border-bottom pb-2"><a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">CLOTHING</a></li>
                    <li class="nav-item border-bottom pb-2 d-flex justify-content-between align-items-center">
                        <a href="#" class="nav-link text-dark fw-medium p-0 menu-spacing">LIFESTYLE</a>
                        <i class="fa-solid fa-chevron-down text-muted"></i>
                    </li>
                </ul>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
