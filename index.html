<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="wrappertengah">
            <div class="container">
                <header>
                    <section class="topbar">
                        <div class="row">
                            <div class="col-lg-12">
                                <!-- Bootstrap Carousel -->
                                <div id="topbarSlider" class="carousel slide vertical-slide" data-bs-ride="carousel" data-bs-interval="3000">
                                    <div class="carousel-inner">
                                        <!-- Konten 1 -->
                                        <div class="carousel-item active">
                                            <div class="d-flex justify-content-center align-items-center">
                                                <span class="badge bg-danger me-2">HOT</span>
                                                <p class="mb-0">Promo Spesial Gajian: Diskon hingga 70%!</p>
                                            </div>
                                        </div>

                                        <!-- Konten 2 -->
                                        <div class="carousel-item">
                                            <div class="d-flex justify-content-center align-items-center">
                                                <span class="badge bg-info me-2">INFO</span>
                                                <p class="mb-0">Toko tetap buka selama hari libur nasional.</p>
                                            </div>
                                        </div>

                                        <!-- Konten 3 -->
                                        <div class="carousel-item">
                                            <div class="d-flex justify-content-center align-items-center">
                                                <span class="badge bg-success me-2">FREE</span>
                                                <p class="mb-0">Gratis Ongkir dengan minimal belanja Rp 100.000.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </header>
                <main>xxx</main>
                <footer></footer>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        <script>
            async function updateTopbar() {
                const textElement = document.getElementById("marquee-data");
                const apiUrl = "api/get-news.php"; // Ganti dengan URL API Anda

                try {
                    const response = await fetch(apiUrl);

                    if (!response.ok) {
                        throw new Error("Gagal mengambil data");
                    }

                    const data = await response.json();

                    // Misalkan struktur JSON dari server adalah: { "message": "Teks dari Database" }
                    textElement.innerText = data.message;
                } catch (error) {
                    console.error("Error:", error);
                    textElement.innerText = "Selamat Datang di Website Kami"; // Fallback jika gagal
                }
            }

            // Jalankan fungsi saat halaman selesai dimuat
            document.addEventListener("DOMContentLoaded", updateTopbar);
        </script>
    </body>
</html>
